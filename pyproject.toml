[project]
name = "natalidade"
version = "0.1.0"
description = "Registros de nascidos vivos e população dos municípios do Maranhão (IBGE)"
readme = "README.md"
authors = [
    { name = "Felipe Moura", email = "olive.felipe2014@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "missingno>=0.5.2",
    "quarto-cli>=1.10.18",
]
